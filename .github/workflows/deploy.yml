# Publie l'app sur GitHub Pages à chaque push sur main, puis lance la publication de la démo
# (handbase-demo/handbase-demo.github.io) sur la même version du code : les deux applis restent à jour ensemble.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Machine de publication : celles de GitHub par défaut. Variable HB_RUNNER = handbase-local pour publier
# depuis le PC (runner auto-hébergé), par exemple pendant un incident GitHub Actions.
jobs:
  build:
    runs-on: ${{ vars.HB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      # GitHub Pages ne connaît pas les routes de l'app : on sert index.html pour toute page inconnue.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ${{ vars.HB_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Démo : même version du code, publiée par le dépôt de la démo (base de test, données fictives).
  # Il faut le secret DEMO_DISPATCH_TOKEN (Settings → Secrets and variables → Actions) : une clé GitHub « fine-grained »
  # limitée au dépôt handbase-demo/handbase-demo.github.io, permission Actions : Read and write. Sans lui, l'étape
  # est sautée (avec un avertissement) et la démo se publie toujours à la main.
  demo:
    needs: deploy
    runs-on: ${{ vars.HB_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Lancer la publication de la démo
        env:
          GH_TOKEN: ${{ secrets.DEMO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Démo non mise à jour : ajouter le secret DEMO_DISPATCH_TOKEN (voir deploy.yml)."
            exit 0
          fi
          # Appel direct à l'API GitHub (curl : présent aussi sur le PC quand HB_RUNNER est utilisé).
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/handbase-demo/handbase-demo.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main","inputs":{"ref":"${{ github.sha }}"}}'
          echo "Publication de la démo lancée sur ${{ github.sha }}."
