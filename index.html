<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Nom de l'appli (APP_NAME entre %) : VITE_APP_NAME, défaut « Nextar Hand » / « Nextar Volley » ; sport (SPORT entre %) : VITE_SPORT, défaut handball ; remplacés à la construction (vite.config.ts), comme le nom du sport de l'écran d'ouverture (SPORT_WORD_BOX, SPORT_WORD_PATH). Icônes : celles du sport (public/, public-sport/<sport>/). -->
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta name="description" content="%APP_NAME% : données physiques et évaluations des jeunes joueurs de %SPORT%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A182D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>%APP_NAME%</title>
    <!-- Écran d'ouverture (logo animé, maquette validée) : posé avant tout script pour qu'il n'y ait ni écran blanc ni saut
         de couleur ; piloté ensuite par src/splashScreen.ts (règles de sortie : src/splash.ts). Couleur = manifeste. -->
    <style>
      html.splash-on,html.splash-on body{background:#0A182D;overflow:hidden}
      #splash{--sp-d:1;position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;background:radial-gradient(circle at 50% 42%,#13304a 0,#0A182D 60%);color:#cfe9ee;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;transition:opacity .45s ease;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
      #splash.sp-short{--sp-d:.7}
      #splash.sp-out{opacity:0}
      #splash .sp-logo{width:min(46vw,220px);aspect-ratio:1}
      #splash .sp-logo svg{display:block;width:100%;height:100%;overflow:visible}
      #splash .sp-word{width:min(52vw,250px);opacity:0;animation:sp-word calc(.5s*var(--sp-d)) ease-out calc(1.3s*var(--sp-d)) both}
      #splash .sp-word svg{display:block;width:100%;height:auto}
      /* Nom du sport sous le mot (icône de l'appli : tools/icones-sport.py), juste après lui. */
      #splash .sp-sport{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-sport calc(.45s*var(--sp-d)) ease-out calc(1.55s*var(--sp-d)) both}
      #splash .sp-bg{transform-box:fill-box;transform-origin:center;animation:sp-pop calc(.5s*var(--sp-d)) cubic-bezier(.2,.9,.3,1.2) both}
      #splash .sp-x{opacity:0;animation:sp-xin calc(.45s*var(--sp-d)) cubic-bezier(.2,.8,.2,1) calc(.15s*var(--sp-d)) both}
      #splash .sp-trail{opacity:0;animation:sp-fade calc(.55s*var(--sp-d)) ease-out calc(.6s*var(--sp-d)) both}
      #splash .sp-star{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-shoot calc(.6s*var(--sp-d)) cubic-bezier(.2,.9,.3,1.15) calc(.55s*var(--sp-d)) both}
      #splash .sp-sync{width:min(60vw,260px);min-height:40px;opacity:0;animation:sp-word .4s ease-out calc(1.8s*var(--sp-d)) both}
      #splash .sp-bar{height:3px;border-radius:3px;background:#1a3c46;overflow:hidden}
      #splash .sp-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#61D0D1,#89F7B3);transition:width .25s}
      #splash .sp-bar.sp-wait i{width:30%;animation:sp-wait 1.3s ease-in-out infinite}
      #splash .sp-txt{margin-top:8px;font-size:12px;text-align:center;color:#8fb3bd;letter-spacing:.02em;font-variant-numeric:tabular-nums}
      #splash .sp-btn{display:none;position:absolute;left:50%;bottom:max(32px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#13304a;color:#cfe9ee;border:1px solid #2a5566;border-radius:10px;padding:10px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}
      #splash .sp-btn.sp-show{display:block;animation:sp-fade .3s both}
      @keyframes sp-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
      @keyframes sp-xin{from{transform:translate(-40px,-40px);opacity:0}to{transform:none;opacity:1}}
      @keyframes sp-shoot{from{transform:translate(-190px,215px) scale(.5);opacity:0}to{transform:none;opacity:1}}
      @keyframes sp-word{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
      @keyframes sp-sport{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
      @keyframes sp-zoom{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
      @keyframes sp-wait{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
      @keyframes sp-fade{from{opacity:0}to{opacity:1}}
      /* « Réduire les animations » : simple fondu du logo (mêmes règles de sortie). */
      @media (prefers-reduced-motion:reduce){
        #splash .sp-bg,#splash .sp-x,#splash .sp-trail,#splash .sp-star,#splash .sp-word,#splash .sp-sport{animation:sp-fade .6s ease-out both}
        #splash .sp-sync{animation:sp-fade .4s ease-out .6s both}
        #splash .sp-bar.sp-wait i{animation:none;width:100%;opacity:.35}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="dialog" aria-modal="true" aria-label="Chargement de %APP_NAME%" aria-busy="true" tabindex="-1">
      <div class="sp-logo"><svg aria-hidden="true" focusable="false" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sp-bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0A182D"/><stop offset="1" stop-color="#1A3C46"/></linearGradient><linearGradient id="sp-cm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#61D0D1" stop-opacity="0"/><stop offset=".6" stop-color="#61D0D1" stop-opacity=".85"/><stop offset="1" stop-color="#89F7B3"/></linearGradient><linearGradient id="sp-st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89F7B3"/><stop offset="1" stop-color="#61D0D1"/></linearGradient></defs><rect class="sp-bg" width="512" height="512" rx="72" fill="url(#sp-bg)"/><path class="sp-x" d="M129.0,161.0 h69.0 L359.0,391.0 h-69.0 Z" fill="#F9F9FA"/><path class="sp-trail" d="M134.75,388.12 L358.07,193.10 A30.19,30.19 0 0 0 313.93,151.90 L134.75,388.12Z" fill="url(#sp-cm)"/><path class="sp-star" d="M407.71,131.10 L351.49,137.70 L318.78,91.51 L307.70,147.01 L253.65,163.85 L303.01,191.54 L302.32,248.14 L343.92,209.76 L397.53,227.90 L373.88,176.48Z" fill="url(#sp-st)" stroke="url(#sp-st)" stroke-width="6.9" stroke-linejoin="round"/></svg></div>
      <div class="sp-word"><svg aria-hidden="true" focusable="false" viewBox="%SPORT_WORD_BOX%" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sp-mv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#89F7B3"/><stop offset="1" stop-color="#61D0D1"/></linearGradient></defs><path fill="#F9F9FA" d="M61.68 262H97.3V122.38L177.64 262H217.42V69.86H181.8V209.74L102.24 69.86H61.68Z M393.18 205.32C394.22 200.12 394.48 197 394.48 191.8C394.48 147.34 363.02 114.58 320.12 114.58C277.74 114.58 244.2 148.12 244.2 190.5C244.2 232.62 278.26 265.38 322.2 265.38C345.86 265.38 364.32 256.8 379.4 239.38C384.86 232.62 388.5 226.64 390.84 219.36H353.14C344.3 229.76 335.72 233.66 321.42 233.66C300.88 233.66 285.8 222.74 281.64 205.32ZM280.6 174.9C286.06 156.18 300.1 146.3 320.64 146.3C341.96 146.3 356 156.44 360.42 174.9Z M598.32 262H632.9V149.42H653.7V117.96H632.9V69.86H598.32V117.96H581.42V149.42H598.32Z M816.98 117.96H785.26V137.2C773.3 121.34 759 114.58 738.2 114.58C695.56 114.58 664.88 146.56 664.88 190.5C664.88 233.92 695.3 265.38 737.42 265.38C757.7 265.38 771.48 259.14 785.26 243.28V262H816.98ZM741.84 146.3C766.54 146.3 784.22 164.76 784.22 191.02C784.22 201.42 780.06 213.38 773.82 220.66C766.8 229.24 755.62 233.66 742.36 233.66C717.14 233.66 699.72 216.5 699.72 191.28C699.72 165.02 717.14 146.3 741.84 146.3Z M842.72 262H877.3V181.92C876.52 160.6 887.44 148.64 908.24 147.86V114.58H905.64C890.82 114.58 883.54 118.74 874.44 132V117.96H842.72Z M403.1,118.0 h43.2 L559.1,262.0 h-43.2 Z"/><path d="M406.66,260.20 L557.88,138.67 A18.91,18.91 0 0 0 531.43,111.65 L406.66,260.20Z" fill="url(#sp-cm)"/><path d="M589.56,99.23 L554.36,103.37 L533.87,74.44 L526.93,109.20 L493.09,119.74 L524.00,137.09 L523.56,172.53 L549.62,148.49 L583.19,159.86 L568.38,127.66Z" fill="url(#sp-st)" stroke="url(#sp-st)" stroke-width="4.3" stroke-linejoin="round"/><path class="sp-sport" d="%SPORT_WORD_PATH%" fill="url(#sp-mv)"/></svg></div>
      <div class="sp-sync"><div class="sp-bar sp-wait"><i></i></div><div class="sp-txt" aria-live="polite">Chargement…</div></div>
      <button type="button" class="sp-btn">Entrer quand même</button>
    </div>
    <script>
      // Écran d'ouverture, avant le premier affichage : logo Nextar animé, appli inerte dessous.
      // Pas d'écran d'ouverture sur un rechargement dans la même session (mise à jour appliquée, souvent en arrière-plan,
      // page rechargée). Filet : si l'appli ne prend pas la main (script introuvable, erreur), l'écran s'en va seul.
      ;(function () {
        var d = document, h = d.documentElement, s = d.getElementById('splash'), r = d.getElementById('root')
        var drop = function () {
          if (s.parentNode) s.parentNode.removeChild(s)
          h.classList.remove('splash-on')
          try { r.inert = false } catch (e) {}
        }
        try {
          var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}
          var seen = false
          try { seen = !!sessionStorage.getItem('handbase.splash'); sessionStorage.setItem('handbase.splash', '1') } catch (e) {}
          if (seen && nav.type === 'reload') return drop()
          h.classList.add('splash-on')
          // Début de l'animation (premier affichage) : origine du temps de l'écran d'ouverture (src/splashScreen.ts).
          window.__splashT0 = performance.now()
          try { r.inert = true } catch (e) {}
          // Pas connecté (serveur connu, aucune session gardée) : animation plus courte avant l'écran de connexion.
          var session = false
          try { for (var i = 0; i < localStorage.length; i++) if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) session = true } catch (e) {}
          var server = false
          try { server = !!localStorage.getItem('handbase.supabase') } catch (e) {}
          if (server && !session) s.classList.add('sp-short')
          window.setTimeout(function () { if (!window.__splash) drop() }, 12000)
        } catch (e) {
          drop()
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
